<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentOrchestra - AI 多智能体协作平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 900px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .card-title {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title .icon {
      font-size: 1.2em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    .form-group select,
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .provider-card {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: white;
    }

    .provider-card:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
    }

    .provider-card.active {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
    }

    .provider-card .icon {
      font-size: 2em;
      margin-bottom: 8px;
    }

    .provider-card .name {
      font-size: 12px;
      font-weight: 500;
      color: #333;
    }

    .provider-card .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      display: inline-block;
    }

    .provider-card .tag.local {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .provider-card .tag.china {
      background: #fff3e0;
      color: #ef6c00;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-success {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .status-indicator.stopped {
      background: #ffebee;
      color: #c62828;
    }

    .status-indicator.running {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-indicator .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-indicator.stopped .dot {
      background: #c62828;
    }

    .status-indicator.running .dot {
      background: #2e7d32;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .info-box {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
    }

    .info-box h4 {
      margin-bottom: 8px;
      color: #667eea;
    }

    .info-box p {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .test-result {
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 13px;
    }

    .test-result.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .test-result.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .logs-container {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 16px;
    }

    .logs-container .log-entry {
      margin-bottom: 4px;
    }

    .logs-container .log-time {
      color: #858585;
    }

    .logs-container .log-info {
      color: #4fc1ff;
    }

    .logs-container .log-error {
      color: #f48771;
    }

    .logs-container .log-success {
      color: #4ec9b0;
    }

    .feature-list {
      list-style: none;
      margin-top: 16px;
    }

    .feature-list li {
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #555;
    }

    .feature-list li::before {
      content: "✓";
      color: #667eea;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎼 AgentOrchestra</h1>
      <p>AI 多智能体协作平台 - 桌面版配置中心</p>
    </div>

    <div class="main-content">
      <!-- 左侧：配置面板 -->
      <div class="card">
        <div class="card-title">
          <span class="icon">⚙️</span>
          模型配置
        </div>

        <div class="info-box">
          <h4>选择 AI 模型提供商</h4>
          <p>支持国际主流模型（OpenAI、Claude）和国产大模型（文心、通义、Kimi 等），以及本地 Ollama 部署。</p>
        </div>

        <div class="provider-grid" id="providerGrid">
          <!-- 动态生成 -->
        </div>

        <div id="configSection" class="hidden">
          <div class="form-group">
            <label>选择模型</label>
            <select id="modelSelect">
              <!-- 动态生成 -->
            </select>
          </div>

          <div class="form-group" id="apiKeyGroup">
            <label>API Key</label>
            <input type="password" id="apiKeyInput" placeholder="输入您的 API Key">
          </div>

          <div class="form-group" id="baseUrlGroup">
            <label>Base URL（可选，用于自定义端点）</label>
            <input type="text" id="baseUrlInput" placeholder="默认使用官方地址">
          </div>

          <div class="btn-group">
            <button class="btn btn-secondary" id="testBtn" onclick="testConnection()">
              🔗 测试连接
            </button>
            <button class="btn btn-primary" id="saveBtn" onclick="saveConfiguration()">
              💾 保存配置
            </button>
          </div>

          <div id="testResult"></div>
        </div>
      </div>

      <!-- 右侧：状态面板 -->
      <div class="card">
        <div class="card-title">
          <span class="icon">📊</span>
          服务状态
        </div>

        <div id="statusIndicator" class="status-indicator stopped">
          <span class="dot"></span>
          <span id="statusText">服务未启动</span>
        </div>

        <div class="info-box">
          <h4>当前配置</h4>
          <p id="currentConfig">未配置</p>
        </div>

        <div class="btn-group">
          <button class="btn btn-success" id="startBtn" onclick="startService()">
            ▶️ 启动服务
          </button>
          <button class="btn btn-secondary" id="stopBtn" onclick="stopService()" disabled>
            ⏹️ 停止服务
          </button>
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-top: 16px;" id="openWebBtn" onclick="openWebInterface()" disabled>
          🌐 打开 Web 界面
        </button>

        <div class="logs-container" id="logsContainer">
          <div class="log-entry">
            <span class="log-time">[系统]</span> 等待启动服务...
          </div>
        </div>

        <h4 style="margin-top: 24px; margin-bottom: 12px;">功能特性</h4>
        <ul class="feature-list">
          <li>多智能体协作系统</li>
          <li>支持 8+ 种大语言模型</li>
          <li>实时任务分配与调度</li>
          <li>可视化工作流编排</li>
          <li>支持本地和云端部署</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
