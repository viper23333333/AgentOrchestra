# ============================================================================
# AgentOrchestra - Release Pipeline
# Triggered on version tag push
# Creates GitHub Release with auto-generated changelog
# ============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  # ==========================================================================
  # Generate Changelog
  # ==========================================================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog_body: ${{ steps.changelog.outputs.body }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREV_TAG=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PREV_TAG="${{ steps.prev_tag.outputs.PREV_TAG }}"

          if [ -n "$PREV_TAG" ]; then
            COMPARE="$PREV_TAG...HEAD"
          else
            COMPARE="HEAD"
          fi

          # Build changelog sections
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md

          # Get merged pull requests
          echo "### Pull Requests" >> changelog.md
          echo "" >> changelog.md
          gh pr list --state merged --base main --json number,title,labels,author \
            --jq '.[] | "- PR #\(.number): \(.title) (@\(.author.login)) \(.labels | map("[\(.name)]") | join(" "))"' \
            >> changelog.md 2>/dev/null || echo "- No merged PRs found" >> changelog.md

          echo "" >> changelog.md

          # Get commits (fallback if no PRs)
          echo "### Commits" >> changelog.md
          echo "" >> changelog.md
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h) by %an" --no-merges >> changelog.md
          else
            git log -20 --pretty=format:"- %s (%h) by %an" --no-merges >> changelog.md
          fi

          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}" >> changelog.md

          # Set output (handle multiline)
          {
            echo 'body<<CHANGELOG_EOF'
            cat changelog.md
            echo 'CHANGELOG_EOF'
          } >> $GITHUB_OUTPUT

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release v${{ needs.changelog.outputs.version }}"
          body: ${{ needs.changelog.outputs.changelog_body }}
          draft: false
          prerelease: ${{ contains(needs.changelog.outputs.version, 'rc') || contains(needs.changelog.outputs.version, 'beta') || contains(needs.changelog.outputs.version, 'alpha') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Post-release notifications
  # ==========================================================================
  notify:
    name: Post-Release Notification
    runs-on: ubuntu-latest
    needs: [changelog, release]
    if: success()
    steps:
      - name: Print release info
        run: |
          echo "::notice::Release v${{ needs.changelog.outputs.version }} has been published successfully!"
          echo "Tag: ${{ github.ref_name }}"
          echo "Version: ${{ needs.changelog.outputs.version }}"
