# ============================================================================
# AgentOrchestra - Nginx Reverse Proxy Configuration
# ============================================================================

# Upstream definitions
upstream frontend {
    server frontend:3000;
    keepalive 64;
}

upstream backend {
    server backend:8000;
    keepalive 64;
}

# ---------------------------------------------------------------------------
# Rate limiting zone
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect (uncomment in production with SSL)
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# ---------------------------------------------------------------------------
# Main server block
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Server name identification
    server_tokens off;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------------------
    # Client limits
    # -----------------------------------------------------------------------
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # -----------------------------------------------------------------------
    # API reverse proxy
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # -----------------------------------------------------------------------
    # WebSocket proxy (for real-time agent communication)
    # -----------------------------------------------------------------------
    location /ws/ {
        limit_req zone=ws_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (long-lived connections)
        proxy_connect_timeout 7d;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;

        # Disable buffering for real-time communication
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # SSE (Server-Sent Events) proxy
    # -----------------------------------------------------------------------
    location /events/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_set_header Accept            "text/event-stream";

        # SSE requires no buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # -----------------------------------------------------------------------
    # Health check endpoint (no logging)
    # -----------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }

    # -----------------------------------------------------------------------
    # Frontend - Next.js application
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js specific headers
        proxy_set_header Accept-Encoding   "";
        proxy_set_header X-Nextjs-Data     1;

        # Disable buffering for SSR
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Next.js static assets (with caching)
    # -----------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Next.js image optimization
    # -----------------------------------------------------------------------
    location /_next/image {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Favicon and robots.txt
    # -----------------------------------------------------------------------
    location = /favicon.ico {
        proxy_pass http://frontend;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        proxy_pass http://frontend;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Deny access to hidden files
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
